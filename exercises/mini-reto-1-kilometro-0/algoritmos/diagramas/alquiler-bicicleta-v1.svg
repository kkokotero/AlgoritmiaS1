<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:418px;height:765px;background:#FFFFFF;" width="418px" height="765px" viewBox="0 0 418 765" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="20" y="32.995" fill="#000" font-size="14" textLength="376.462" font-weight="700">Alquiler de bicicleta - Versión 1 (sin decisiones)</text></g><rect x="56.627" y="55.042" width="298.208" height="20.953" fill="none" style="stroke:none;"/><line x1="56.627" y1="55.042" x2="56.627" y2="644.589" style="stroke:#000;stroke-width:1.5;"/><ellipse cx="255.976" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="162.978" y="120.995" width="185.996" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="172.978" y="142.134" fill="#000" font-size="12" textLength="134.186">El cliente llega al local</text><text x="172.978" y="156.103" fill="#000" font-size="12" textLength="165.996">y pide alquilar una bicicleta</text><rect x="173.212" y="188.933" width="165.529" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="183.212" y="210.071" fill="#000" font-size="12" textLength="145.529">Se le pide el documento</text><text x="183.212" y="224.04" fill="#000" font-size="12" textLength="75.381">de identidad</text><rect x="179.39" y="256.87" width="153.172" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.39" y="278.009" fill="#000" font-size="12" textLength="116.438">Se elige la bicicleta</text><text x="189.39" y="291.978" fill="#000" font-size="12" textLength="133.172">que le guste al cliente</text><rect x="180.761" y="324.808" width="150.43" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="190.761" y="345.946" fill="#000" font-size="12" textLength="130.43">Se le cobra el alquiler</text><rect x="184.104" y="378.776" width="143.744" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="194.104" y="399.915" fill="#000" font-size="12" textLength="123.744">Se revisa la bicicleta</text><rect x="179.569" y="432.745" width="152.814" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.569" y="453.884" fill="#000" font-size="12" textLength="132.814">Se le entrega el casco</text><text x="189.569" y="467.853" fill="#000" font-size="12" textLength="76.934">y el candado</text><rect x="172.125" y="500.683" width="167.703" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="182.125" y="521.821" fill="#000" font-size="12" textLength="147.703">Se anota todo en el libro</text><rect x="177.6" y="554.651" width="156.752" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="187.6" y="575.79" fill="#000" font-size="12" textLength="123.539">El cliente se despide</text><text x="187.6" y="589.759" fill="#000" font-size="12" textLength="136.752">y se va con la bicicleta</text><ellipse cx="255.976" cy="633.589" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="255.976" cy="633.589" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="156.978" y1="55.042" x2="156.978" y2="644.589" style="stroke:#000;stroke-width:1.5;"/><line x1="352.974" y1="55.042" x2="352.974" y2="644.589" style="stroke:#000;stroke-width:1.5;"/><line x1="255.976" y1="100.995" x2="255.976" y2="120.995" style="stroke:#181818;stroke-width:1;"/><polygon points="251.976,110.995,255.976,120.995,259.976,110.995,255.976,114.995" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miter