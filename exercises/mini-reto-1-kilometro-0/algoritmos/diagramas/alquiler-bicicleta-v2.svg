<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2500" viewBox="0 0 1360 2500" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de flujo del alquiler de bicicleta, versión corregida</title>
  <desc id="description">El proceso comprueba los datos, la bicicleta y el equipo antes de cobrar. Cada condición incumplida lleva a cancelar sin cobro; si se cumplen todas, registra el alquiler y entrega bicicleta, casco y candado.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .action { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .decision { fill: #fff7ed; stroke: #9a3412; stroke-width: 2.5; }
      .terminal { fill: #dcfce7; stroke: #166534; stroke-width: 2.5; }
      .cancel { fill: #fee2e2; stroke: #991b1b; stroke-width: 2.5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .cancel-flow { fill: none; stroke: #991b1b; stroke-width: 2; marker-end: url(#arrow); }
      .trunk { fill: none; stroke: #991b1b; stroke-width: 2; }
      text { fill: #0f172a; font-family: sans-serif; font-size: 18px; text-anchor: middle; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 16px; }
      .cancel-text { fill: #7f1d1d; }
    </style>
  </defs>

  <text class="title" x="560" y="42">Alquiler de bicicleta — versión corregida</text>

  <rect class="terminal" x="450" y="65" width="220" height="55" rx="28"/>
  <text x="560" y="100">INICIO</text>
  <path class="flow" d="M560 120 V150"/>

  <rect class="action" x="310" y="150" width="500" height="78" rx="12"/>
  <text x="560" y="181">Saludar y pedir nombre completo</text>
  <text x="560" y="207">y cédula o pasaporte</text>
  <path class="flow" d="M560 228 V252"/>

  <polygon class="decision" points="560,252 770,300 560,348 350,300"/>
  <text x="560" y="295">¿Presenta un documento</text>
  <text x="560" y="318">de identidad?</text>
  <text class="label" x="580" y="368">Sí</text>
  <path class="flow" d="M560 348 V390"/>
  <text class="label cancel-text" x="825" y="292">No</text>
  <path class="cancel-flow" d="M770 300 H1080"/>

  <rect class="action" x="310" y="390" width="500" height="65" rx="12"/>
  <text x="560" y="430">Contar las bicicletas disponibles</text>
  <path class="flow" d="M560 455 V480"/>

  <polygon class="decision" points="560,480 770,528 560,576 350,528"/>
  <text x="560" y="523">¿Hay bicicletas</text>
  <text x="560" y="546">disponibles?</text>
  <text class="label" x="580" y="596">Sí</text>
  <path class="flow" d="M560 576 V620"/>
  <text class="label cancel-text" x="825" y="520">No</text>
  <path class="cancel-flow" d="M770 528 H1080"/>

  <rect class="action" x="310" y="620" width="500" height="82" rx="12"/>
  <text x="560" y="653">Preguntar si alquilará por una hora</text>
  <text x="560" y="679">o por un día; máximo 3 respuestas</text>
  <path class="flow" d="M560 702 V725"/>

  <polygon class="decision" points="560,725 770,773 560,821 350,773"/>
  <text x="560" y="768">¿Respondió "hora"</text>
  <text x="560" y="791">o "día"?</text>
  <text class="label" x="580" y="841">Sí</text>
  <path class="flow" d="M560 821 V860"/>
  <text class="label cancel-text" x="825" y="765">No, tras 3 intentos</text>
  <path class="cancel-flow" d="M770 773 H1080"/>

  <rect class="action" x="310" y="860" width="500" height="88" rx="12"/>
  <text x="560" y="892">Asignar el precio: $5.000 por hora</text>
  <text x="560" y="918">o $15.000 por día; pedir talla S, M o L</text>
  <path class="flow" d="M560 948 V972"/>

  <polygon class="decision" points="560,972 770,1020 560,1068 350,1020"/>
  <text x="560" y="1015">¿Indicó una talla válida</text>
  <text x="560" y="1038">en 3 respuestas o menos?</text>
  <text class="label" x="580" y="1088">Sí</text>
  <path class="flow" d="M560 1068 V1110"/>
  <text class="label cancel-text" x="825" y="1012">No</text>
  <path class="cancel-flow" d="M770 1020 H1080"/>

  <rect class="action" x="310" y="1110" width="500" height="92" rx="12"/>
  <text x="560" y="1143">Revisar las bicicletas en el orden del rack:</text>
  <text x="560" y="1169">frenos, luces y cambios. Apartar las que fallen</text>
  <path class="flow" d="M560 1202 V1225"/>

  <polygon class="decision" points="560,1225 770,1273 560,1321 350,1273"/>
  <text x="560" y="1268">¿Se encontró una bicicleta</text>
  <text x="560" y="1291">que pasó todas las pruebas?</text>
  <text class="label" x="580" y="1341">Sí</text>
  <path class="flow" d="M560 1321 V1360"/>
  <text class="label cancel-text" x="825" y="1265">No quedan bicicletas</text>
  <path class="cancel-flow" d="M770 1273 H1080"/>

  <rect class="action" x="310" y="1360" width="500" height="102" rx="12"/>
  <text x="560" y="1393">Reservar casco solicitado; si no hay, ofrecer</text>
  <text x="560" y="1419">M para S o L, o S para M</text>
  <text class="small" x="560" y="1445">Solo se ofrece esa alternativa</text>
  <path class="flow" d="M560 1462 V1485"/>

  <polygon class="decision" points="560,1485 770,1533 560,1581 350,1533"/>
  <text x="560" y="1528">¿Hay casco y el cliente</text>
  <text x="560" y="1551">acepta la talla ofrecida?</text>
  <text class="label" x="580" y="1601">Sí</text>
  <path class="flow" d="M560 1581 V1620"/>
  <text class="label cancel-text" x="825" y="1525">No</text>
  <path class="cancel-flow" d="M770 1533 H1080"/>

  <rect class="action" x="310" y="1620" width="500" height="88" rx="12"/>
  <text x="560" y="1653">Probar los candados en orden:</text>
  <text x="560" y="1679">apartar los que no abran y cierren con llave</text>
  <path class="flow" d="M560 1708 V1732"/>

  <polygon class="decision" points="560,1732 770,1780 560,1828 350,1780"/>
  <text x="560" y="1775">¿Se encontró un candado</text>
  <text x="560" y="1798">que funciona?</text>
  <text class="label" x="580" y="1848">Sí</text>
  <path class="flow" d="M560 1828 V1870"/>
  <text class="label cancel-text" x="825" y="1772">No quedan candados</text>
  <path class="cancel-flow" d="M770 1780 H1080"/>

  <rect class="action" x="310" y="1870" width="500" height="92" rx="12"/>
  <text x="560" y="1903">Cobrar una vez. Si paga de más, devolver</text>
  <text x="560" y="1929">la diferencia; si paga de menos, devolverle</text>
  <text x="560" y="1953">todo y cancelar</text>
  <path class="flow" d="M560 1962 V1985"/>

  <polygon class="decision" points="560,1985 770,2033 560,2081 350,2033"/>
  <text x="560" y="2028">¿Entregó el precio</text>
  <text x="560" y="2051">completo o más?</text>
  <text class="label" x="580" y="2101">Sí</text>
  <path class="flow" d="M560 2081 V2120"/>
  <text class="label cancel-text" x="825" y="2025">No</text>
  <path class="cancel-flow" d="M770 2033 H1080"/>

  <rect class="action" x="310" y="2120" width="500" height="100" rx="12"/>
  <text x="560" y="2153">Registrar el alquiler y la devolución:</text>
  <text x="560" y="2179">en 1 hora, una hora después; por 1 día,</text>
  <text x="560" y="2205">a la misma hora del día siguiente</text>
  <path class="flow" d="M560 2220 V2260"/>

  <rect class="action" x="310" y="2260" width="500" height="68" rx="12"/>
  <text x="560" y="2290">Entregar bicicleta, casco, candado</text>
  <text x="560" y="2315">funcional y comprobante</text>
  <path class="flow" d="M560 2328 V2350"/>

  <rect class="terminal" x="450" y="2350" width="220" height="55" rx="28"/>
  <text x="560" y="2385">FIN: alquiler completo</text>

  <path class="trunk" d="M1080 300 V2420"/>
  <path class="cancel-flow" d="M1080 2420 V2440"/>
  <rect class="cancel" x="860" y="2440" width="440" height="52" rx="26"/>
  <text class="cancel-text" x="1080" y="2473">FIN: explicar y cancelar sin cobrar</text>

</svg>
