<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de flujo de cotización de recorrido guiado</title>
  <desc id="description">Algoritmo secuencial que lee el recorrido, precio y cantidad de personas, calcula el total, el anticipo redondeado y el saldo, y muestra los resultados.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .process { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.5; }
      .io { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .terminal { fill: #fef3c7; stroke: #b45309; stroke-width: 2.5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      text { fill: #0f172a; font-family: sans-serif; font-size: 19px; text-anchor: middle; }
      .title { font-size: 27px; font-weight: 700; }
      .small { font-size: 17px; }
    </style>
  </defs>

  <text class="title" x="450" y="42">Cotización de recorrido guiado</text>
  <ellipse class="terminal" cx="450" cy="100" rx="110" ry="34"/>
  <text x="450" y="107">Inicio</text>

  <path class="flow" d="M450 134 V165"/>
  <polygon class="io" points="270,165 630,165 600,235 240,235"/>
  <text x="435" y="195">Leer nombre del recorrido,</text>
  <text x="435" y="220">precio por persona y personas</text>

  <path class="flow" d="M435 235 V275"/>
  <rect class="process" x="250" y="275" width="400" height="82" rx="12"/>
  <text x="450" y="309">TotalGrupo &lt;-</text>
  <text x="450" y="337">PrecioPorPersona × CantidadPersonas</text>

  <path class="flow" d="M450 357 V397"/>
  <rect class="process" x="250" y="397" width="400" height="70" rx="12"/>
  <text x="450" y="440">PorcentajeAnticipo &lt;- 0.30</text>

  <path class="flow" d="M450 467 V507"/>
  <rect class="process" x="250" y="507" width="400" height="82" rx="12"/>
  <text x="450" y="541">Anticipo &lt;- Redon(</text>
  <text x="450" y="569">TotalGrupo × PorcentajeAnticipo)</text>

  <path class="flow" d="M450 589 V629"/>
  <rect class="process" x="250" y="629" width="400" height="70" rx="12"/>
  <text x="450" y="672">SaldoPendiente &lt;- TotalGrupo - Anticipo</text>

  <path class="flow" d="M450 699 V739"/>
  <polygon class="io" points="270,739 630,739 600,829 240,829"/>
  <text x="435" y="775">Mostrar recorrido, total,</text>
  <text x="435" y="802">anticipo y saldo pendiente</text>

  <path class="flow" d="M435 829 V875"/>
  <ellipse class="terminal" cx="450" cy="915" rx="110" ry="34"/>
  <text x="450" y="922">Fin</text>

  <rect x="145" y="985" width="610" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="small" x="450" y="1020">Entrada / salida: paralelogramo</text>
  <text class="small" x="450" y="1050">Proceso: rectángulo · Inicio y fin: óvalo</text>
</svg>
