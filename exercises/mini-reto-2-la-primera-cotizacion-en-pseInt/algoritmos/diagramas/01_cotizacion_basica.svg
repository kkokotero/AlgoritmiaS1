<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de flujo de la cotización básica</title>
  <desc id="description">El algoritmo define sus variables y el precio, lee el nombre del cliente y las horas, calcula el total y muestra la cotización.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .terminal { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      text { fill: #0f172a; font-family: sans-serif; font-size: 17px; text-anchor: middle; }
      .small { font-size: 15px; }
    </style>
  </defs>
  <rect x="250" y="20" width="220" height="48" rx="24" class="terminal"/>
  <text x="360" y="50">Inicio</text>

  <line x1="360" y1="68" x2="360" y2="96" class="line"/>
  <rect x="210" y="98" width="300" height="72" rx="8" class="box"/>
  <text x="360" y="128">Definir nombre, horas,</text>
  <text x="360" y="151">precio por hora y total</text>

  <line x1="360" y1="170" x2="360" y2="198" class="line"/>
  <rect x="210" y="200" width="300" height="64" rx="8" class="box"/>
  <text x="360" y="228">Guardar el precio por hora:</text>
  <text x="360" y="251">10.000 pesos</text>

  <line x1="360" y1="264" x2="360" y2="292" class="line"/>
  <rect x="210" y="294" width="300" height="64" rx="8" class="box"/>
  <text x="360" y="322">Preguntar el nombre</text>
  <text x="360" y="345">del cliente</text>

  <line x1="360" y1="358" x2="360" y2="386" class="line"/>
  <rect x="210" y="388" width="300" height="52" rx="8" class="box"/>
  <text x="360" y="421">Leer el nombre</text>

  <line x1="360" y1="440" x2="360" y2="468" class="line"/>
  <rect x="210" y="470" width="300" height="64" rx="8" class="box"/>
  <text x="360" y="498">Preguntar cuántas horas</text>
  <text x="360" y="521">alquilará la bicicleta</text>

  <line x1="360" y1="534" x2="360" y2="562" class="line"/>
  <rect x="210" y="564" width="300" height="52" rx="8" class="box"/>
  <text x="360" y="597">Leer las horas</text>

  <line x1="360" y1="616" x2="360" y2="644" class="line"/>
  <rect x="210" y="646" width="300" height="58" rx="8" class="box"/>
  <text x="360" y="671">Calcular el total:</text>
  <text x="360" y="693" class="small">horas × precio por hora</text>

  <line x1="360" y1="704" x2="360" y2="732" class="line"/>
  <rect x="150" y="734" width="420" height="52" rx="8" class="box"/>
  <text x="360" y="756" class="small">Saludar al cliente e informar</text>
  <text x="360" y="777" class="small">las horas y el total a pagar</text>

  <line x1="360" y1="786" x2="360" y2="808" class="line"/>
  <rect x="250" y="810" width="220" height="48" rx="24" class="terminal"/>
  <text x="360" y="840">Fin</text>
</svg>
